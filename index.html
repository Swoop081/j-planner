<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Us Planner">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Us Planner</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--mut:#8a8a8e;--me:#0a84ff;--you:#ff375f;--line:#e5e5ea;--ok:#30b050;--warn:#ff9f0a;--bad:#ff3b30}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--line:#2c2c2e;--mut:#98989d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 4px;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0}
h2{margin:0 0 10px}
h3{margin:14px 0 6px;font-size:15px}
.nav{display:flex;gap:6px;align-items:center}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--card);color:var(--text)}
button.pri{background:var(--me);color:#fff}
button.del{color:var(--bad)}
main{padding:6px 12px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.empty{color:var(--mut);font-size:14px}
.hint{font-size:13px;color:var(--mut);padding:0 0 6px}
small{display:block;color:var(--mut);font-size:13px}

/* tabs + fab */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;border-radius:0;background:none;padding:14px 4px;color:var(--mut)}
.tabs button.on{color:var(--me);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:27px;font-size:30px;line-height:1;padding:0;box-shadow:0 4px 12px #0004;z-index:6}

/* shift pills + brush bar */
.pill{display:inline-block;border-radius:999px;padding:4px 12px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.pill.off{background:#8e8e93}
.pill.none{background:transparent;color:var(--mut);border:1px dashed var(--line);font-weight:400}
.brush{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 8px;margin:0 -16px;scrollbar-width:none}
.brush::-webkit-scrollbar{display:none}
.cb{flex:none;border-radius:999px;padding:9px 14px;color:#fff;font-weight:600;font-size:15px;white-space:nowrap}
.cb.off{background:#8e8e93}
.cb.clr,.cb.edit{background:var(--card);color:var(--text);font-weight:500}
.cb.on{outline:3px solid var(--text);outline-offset:2px}

/* roster */
.sum{font-size:14px;color:var(--mut);margin:0 4px 8px}
.sum b{color:var(--text)}
.rday{cursor:pointer}
.rday.armed{outline:2px dashed color-mix(in srgb,var(--me) 50%,transparent)}
.rday .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rday .hd b{font-size:16px}
.rday.today .hd b{color:var(--me)}
.badge{font-size:12px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);padding:2px 8px;border-radius:999px;font-weight:600}
.srow{display:flex;align-items:center;gap:10px;margin:4px 0}
.who{width:64px;font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:13px;margin-top:6px;padding:4px 8px;border-radius:8px;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.mini.confirmed{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.btnrow{display:flex;gap:8px;margin:4px 0 14px}
.btnrow button{flex:1}

/* month */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .h{font-size:12px;color:var(--mut);padding:4px 0}
.cell{padding:8px 0;border-radius:10px;background:none;min-height:46px}
.cell.sel{background:var(--me);color:#fff}
.cell.tod{font-weight:700;color:var(--me)}
.cell.sel.tod{color:#fff}
.dots{height:6px;display:flex;justify-content:center;gap:2px;margin-top:2px}
.dots i{width:5px;height:5px;border-radius:3px;background:var(--warn)}
.dots i.confirmed{background:var(--ok)}
.dots i.act{background:var(--bad)}
.cell.sel .dots i{box-shadow:0 0 0 1px #fff8}
.sec{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 6px}
.plan{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.plan:last-child{border-bottom:0}
.plan b{display:block}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;font-weight:600;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tag.tentative{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.confirmed{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.act{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.todo{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input{width:24px;height:24px;flex:none}
.todo .info{flex:1;cursor:pointer}
.todo.over small{color:var(--bad)}
.dayline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}

/* month overview */
.mw{background:var(--card);border-radius:14px;padding:6px;margin-bottom:8px}
.mrow{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:2px;margin-top:3px;align-items:stretch}
.ml{font-size:11px;font-weight:600;color:var(--mut);display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:2px}
.md{display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:3px 0;background:none;font-size:14px;font-weight:600;line-height:1.1}
.md small{font-size:10px;color:var(--mut);font-weight:500}
.md.tod{background:var(--me);color:#fff}
.md.tod small{color:#ffffffcc}
.md.sel{outline:2px solid var(--text);outline-offset:-2px}
.mc{display:flex;align-items:center;justify-content:center;text-align:center;min-height:36px;border-radius:7px;font-size:11px;font-weight:700;line-height:1.1;padding:0 1px;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 62%,#000)}
.mc.none{background:none}
.md.dim,.mc.dim,.mpc.dim{opacity:.4}
.mpc{min-width:0;min-height:14px}
.mp{font-size:10px;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 3px;border-radius:4px;margin-bottom:1px}
.mp.tentative{background:color-mix(in srgb,var(--warn) 22%,transparent);color:#8a5a00}
.mp.confirmed{background:color-mix(in srgb,var(--ok) 20%,transparent);color:#1e7a37}
.mp.act{background:color-mix(in srgb,var(--bad) 18%,transparent);color:#b3261e}
.mp.more{color:var(--mut)}
@media(prefers-color-scheme:dark){.mc{color:color-mix(in srgb,var(--c) 70%,#fff)}.mp.tentative{color:#ffd27a}.mp.confirmed{color:#7be495}.mp.act{color:#ff8f88}}

/* alerts */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.chip2{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.chip2.on{border-color:var(--me);background:color-mix(in srgb,var(--me) 14%,transparent);color:var(--me)}

/* lists */
.note{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.note.done span{text-decoration:line-through;color:var(--mut)}
.note span{flex:1}
.note input{width:22px;height:22px}

/* sheet + forms */
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--text);max-width:100%}
.sheet input[type=text],.sheet input:not([type]),.sheet textarea,.sheet input[type=date]{width:100%;margin:5px 0}
input[type=time]{width:120px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row>button{flex:none}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0}
.chk input{width:20px;height:20px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;background:none}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px #0003}
.sw{width:30px;height:30px;border-radius:15px;padding:0}
.sw.on{outline:3px solid var(--text);outline-offset:2px}
.sw.auto{width:auto;padding:0 12px;border-radius:15px;background:var(--bg)}
#join{padding:24px}
#join input{width:100%;margin:6px 0 12px}
</style>
</head>
<body>
<div id="join" style="display:none">
  <h1>Us Planner</h1>
  <p class="empty">Enter the same space code on both phones to sync.</p>
  <label>Your name</label><input id="jName" placeholder="e.g. Sam" autocomplete="off">
  <label>Space code</label><input id="jCode" placeholder="e.g. sam-and-alex-7f3k" autocapitalize="none" autocomplete="off">
  <button class="pri" id="jGo" style="width:100%">Start</button>
  <p class="empty" id="jErr"></p>
  <p class="empty">Tip: make the code long and random. Anyone with it can see your planner.</p>
</div>

<div id="app" style="display:none">
<header>
  <div class="top"><h1 id="title"></h1><div class="nav"><button id="prev">‹</button><button id="today">Today</button><button id="next">›</button></div></div>
  <div id="sub"></div>
</header>
<main id="view"></main>
<button class="fab pri" id="fab">+</button>
<div class="tabs">
  <button data-t="roster" class="on">Roster</button><button data-t="month">Month</button><button data-t="notes">Lists</button><button data-t="alerts">Alerts</button>
</div>
</div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayName=d=>DAYS[(d.getDay()+6)%7];
const dateLabel=k=>{const d=parse(k);return `${dayName(d)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`};

/* time helpers */
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return m?`${h}:${pad(m)}${ap}`:`${h}${ap}`};
const range=(s,e)=>`${t12(s)}–${t12(e)}`;
const autoColor=s=>{const h=+String(s||'9').split(':')[0];return h<10?'#ff9f0a':h<16?'#bf5af2':'#5e5ce6'};
const hrs=(s,e)=>{let a=toMin(s),b=toMin(e);if(b<=a)b+=1440;return(b-a)/60};
const nf=n=>String(Math.round(n*10)/10);

let me=localStorage.me, code=localStorage.code, tab='roster';
let weekStart=monday(new Date()), monthRef=new Date(), sel=fmt(new Date());
let brush=null; // {kind:'tpl',id} | {kind:'off'} | {kind:'clear'}
let items=[], col=null, sheetFn=null, tplSig='';

const meId=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_');
const sid=(by,k)=>`shift_${meId(by)}_${k}`;
const shiftOf=(by,k)=>items.find(i=>i.id===sid(by,k));
const partner=()=>{const p=items.find(i=>i.by&&i.by!==me);return p?p.by:null};
const templates=()=>items.filter(i=>i.type==='template'&&i.by===me).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
const plansOn=k=>items.filter(i=>i.type==='plan'&&i.date===k).sort(byDT);
const byDT=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
const needsAction=p=>p.action&&!p.actionDone;

const DT={wfh:{l:'WFH',c:'#0f766e',n:'Work from home'},office:{l:'Office',c:'#15803d',n:'Office'},leave:{l:'Leave',c:'#a16207',n:'Leave'}};

function pill(s){
  if(!s)return '<span class="pill none">–</span>';
  if(s.shiftType==='off')return '<span class="pill off">Off</span>';
  if(DT[s.shiftType])return `<span class="pill" style="background:${DT[s.shiftType].c}">${DT[s.shiftType].l}</span>`;
  if(!s.start||!s.end)return '<span class="pill none">–</span>';
  const ov=toMin(s.end)<=toMin(s.start)?' +1':'';
  return `<span class="pill" style="background:${s.color||autoColor(s.start)}">${range(s.start,s.end)}${ov}</span>`;
}

/* ---------- boot ---------- */
function boot(){
  if(!window.FIREBASE_CONFIG||FIREBASE_CONFIG.apiKey==='PASTE_HERE'){
    document.body.innerHTML='<div style="padding:24px"><h2>Almost there</h2><p>Open <b>config.js</b> and paste your Firebase config.</p></div>';return;}
  if(!me||!code){$('#join').style.display='block';$('#jName').value=me||'';$('#jCode').value=code||'';return;}
  $('#join').style.display='none';$('#app').style.display='block';
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().signInAnonymously().then(()=>{
    col=db.collection('spaces').doc(code).collection('items');
    col.onSnapshot(s=>{
      items=s.docs.map(d=>({id:d.id,...d.data()}));
      render();
      if(sheetFn===openTplSheet&&templates().map(t=>t.id).join()!==tplSig)openTplSheet();
    },e=>console.error(e));
  }).catch(e=>alert('Sign-in failed: '+e.message));
  render();
}
$('#jGo').onclick=()=>{
  const n=$('#jName').value.trim(),c=$('#jCode').value.trim().toLowerCase();
  if(!n||c.length<6){$('#jErr').textContent='Enter your name and a code of 6+ characters.';return}
  localStorage.me=n;localStorage.code=c;location.reload();
};

/* ---------- render ---------- */
function render(){
  $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#fab').style.display=tab==='month'?'block':'none';
  ['#prev','#next','#today'].forEach(s=>$(s).style.visibility=(tab==='notes'||tab==='alerts')?'hidden':'visible');
  const v=$('#view'),sub=$('#sub');
  if(tab==='roster'){
    const e=addDays(weekStart,6);
    $('#title').textContent=`${weekStart.getDate()} ${MONTHS[weekStart.getMonth()].slice(0,3)} – ${e.getDate()} ${MONTHS[e.getMonth()].slice(0,3)}`;
    sub.innerHTML=brushBar();v.innerHTML=rosterView();
  }else if(tab==='month'){
    $('#title').textContent=`${MONTHS[monthRef.getMonth()]} ${monthRef.getFullYear()}`;
    sub.innerHTML='';v.innerHTML=monthView();
  }else if(tab==='alerts'){
    $('#title').textContent='Alerts';sub.innerHTML='';
    v.innerHTML=alertsView();bindAlerts();return;
  }else{
    $('#title').textContent='Lists';sub.innerHTML='';
    if($('#noteList')){$('#noteList').innerHTML=noteRows();bindNotes();return}
    v.innerHTML=notesView();
    $('#addNote').onclick=addNote;
    $('#newNote').onkeydown=e=>{if(e.key==='Enter')addNote()};
    bindNotes();return;
  }
  bind();
}

/* ---------- roster ---------- */
function brushBar(){
  const tpls=templates();
  let h='<div class="brush">';
  tpls.forEach(t=>{
    const on=brush&&brush.kind==='tpl'&&brush.id===t.id;
    h+=`<button class="cb ${on?'on':''}" data-b="tpl:${t.id}" style="background:${t.color||autoColor(t.start)}">${range(t.start,t.end)}</button>`;
  });
  Object.entries(DT).forEach(([k,t])=>{h+=`<button class="cb ${brush&&brush.kind===k?'on':''}" data-b="${k}" style="background:${t.c}">${t.l}</button>`});
  h+=`<button class="cb off ${brush&&brush.kind==='off'?'on':''}" data-b="off">Off</button>`;
  h+=`<button class="cb clr ${brush&&brush.kind==='clear'?'on':''}" data-b="clear">Clear</button>`;
  h+=`<button class="cb edit" data-b="edit">${tpls.length?'Edit':'+ Shift templates'}</button></div>`;
  let hint;
  if(brush){
    const what=brush.kind==='off'?'Day off':DT[brush.kind]?DT[brush.kind].n:brush.kind==='clear'?'Clear':range(...(()=>{const t=items.find(i=>i.id===brush.id);return t?[t.start,t.end]:['',''];})());
    hint=`<b>${what}</b> selected. Tap the days to apply, tap it again to stop.`;
  }else hint=tpls.length?'Pick a shift, then tap the days. Tap a day with nothing picked for custom times.':'Add your usual shifts so each day is one tap.';
  return h+`<div class="hint">${hint}</div>`;
}

function weekHours(by){
  let t=0;
  for(let i=0;i<7;i++){const s=shiftOf(by,fmt(addDays(weekStart,i)));if(s&&s.shiftType==='work'&&s.start&&s.end)t+=hrs(s.start,s.end)}
  return t;
}

function rosterView(){
  const p=partner(),today=fmt(new Date());
  const wfh=by=>{const c={};for(let i=0;i<7;i++){const s=shiftOf(by,fmt(addDays(weekStart,i)));if(s&&DT[s.shiftType])c[s.shiftType]=(c[s.shiftType]||0)+1}const t=Object.entries(c).map(([k,n])=>`${n} ${DT[k].l}`).join(', ');return t?` + ${t}`:''};
  let h=`<div class="sum">Rostered this week: Me <b>${nf(weekHours(me))}h</b>${wfh(me)}${p?` · ${esc(p)} <b>${nf(weekHours(p))}h</b>${wfh(p)}`:''}</div>`;
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i),k=fmt(d);
    const mine=shiftOf(me,k),theirs=p?shiftOf(p,k):null;
    const both=mine&&theirs&&mine.shiftType==='off'&&theirs.shiftType==='off';
    h+=`<div class="card rday ${k===today?'today':''} ${brush?'armed':''}" data-rd="${k}">
      <div class="hd"><b>${DAYS[i]} ${d.getDate()}</b>${both?'<span class="badge">Both off</span>':''}</div>
      <div class="srow"><span class="who">Me</span>${pill(mine)}</div>
      ${p?`<div class="srow"><span class="who">${esc(p)}</span>${pill(theirs)}</div>`:''}
      ${plansOn(k).map(x=>`<div class="mini ${x.status}" data-plan="${x.id}">${x.time?t12(x.time)+' · ':''}${esc(x.title)}${needsAction(x)?' ⚠︎':''}</div>`).join('')}
    </div>`;
  }
  h+=`<div class="btnrow"><button id="copyLast">Copy my shifts from last week</button></div>`;
  return h;
}

function setShift(k,data){return col.doc(sid(me,k)).set({type:'shift',date:k,by:me,createdAt:Date.now(),...data})}

function applyDay(k){
  if(!brush){openDaySheet(k);return}
  if(brush.kind==='clear'){col.doc(sid(me,k)).delete();return}
  if(brush.kind==='off'){setShift(k,{shiftType:'off',start:'',end:'',color:''});return}
  if(DT[brush.kind]){setShift(k,{shiftType:brush.kind,start:'',end:'',color:DT[brush.kind].c});return}
  const t=items.find(i=>i.id===brush.id);
  if(!t){brush=null;render();return}
  setShift(k,{shiftType:'work',start:t.start,end:t.end,color:t.color||autoColor(t.start)});
}

function copyLast(){
  if(!confirm("Copy your shifts from last week into this week? This replaces any shifts you've already set this week."))return;
  const b=col.firestore.batch();
  for(let i=0;i<7;i++){
    const from=fmt(addDays(weekStart,i-7)),to=fmt(addDays(weekStart,i));
    const s=shiftOf(me,from),ref=col.doc(sid(me,to));
    if(s){const{id,...rest}=s;b.set(ref,{...rest,date:to,createdAt:Date.now()})}else b.delete(ref);
  }
  b.commit();
}

/* ---------- month ---------- */
function planRow(p){
  const need=needsAction(p);
  return `<div class="plan" data-plan="${p.id}"><div><b>${esc(p.title)}</b>
    <small>${dateLabel(p.date)}${p.time?' · '+t12(p.time):''} · ${esc(p.by)}</small>${p.notes?`<small>${esc(p.notes)}</small>`:''}</div>
    <div class="tags"><span class="tag ${p.status==='confirmed'?'confirmed':'tentative'}">${p.status==='confirmed'?'Confirmed':'Tentative'}</span>${need?`<span class="tag act">${esc(p.action)}</span>`:''}</div></div>`;
}

const tc=t=>{let[h,m]=t.split(':').map(Number);h=h%12||12;return m?`${h}:${pad(m)}`:`${h}`};
function mcell(s,k,cls){
  const d=`data-day="${k}"`;
  if(!s)return `<div class="mc none ${cls}" ${d}></div>`;
  if(s.shiftType==='off')return `<div class="mc ${cls}" ${d} style="--c:#8e8e93">Off</div>`;
  if(DT[s.shiftType])return `<div class="mc ${cls}" ${d} style="--c:${DT[s.shiftType].c}">${DT[s.shiftType].l}</div>`;
  if(!s.start||!s.end)return `<div class="mc none ${cls}" ${d}></div>`;
  return `<div class="mc ${cls}" ${d} style="--c:${s.color||autoColor(s.start)}">${tc(s.start)}–${tc(s.end)}</div>`;
}
function monthGrid(y,m,today){
  const p=partner(),start=monday(new Date(y,m,1)),last=new Date(y,m+1,0);
  const weeks=Math.ceil((Math.round((last-start)/86400000)+1)/7);
  let h='';
  for(let w=0;w<weeks;w++){
    const days=[...Array(7)].map((_,i)=>addDays(start,w*7+i)),ks=days.map(fmt),dim=days.map(d=>d.getMonth()!==m?'dim':'');
    h+=`<div class="mw"><div class="mrow"><div class="ml"></div>${days.map((d,i)=>`<button class="md ${dim[i]} ${ks[i]===today?'tod':''} ${ks[i]===sel?'sel':''}" data-day="${ks[i]}">${d.getDate()}<small>${DAYS[i][0]}</small></button>`).join('')}</div>`;
    h+=`<div class="mrow"><div class="ml">Me</div>${ks.map((k,i)=>mcell(shiftOf(me,k),k,dim[i])).join('')}</div>`;
    if(p)h+=`<div class="mrow"><div class="ml">${esc(p)}</div>${ks.map((k,i)=>mcell(shiftOf(p,k),k,dim[i])).join('')}</div>`;
    if(ks.some(k=>plansOn(k).length))h+=`<div class="mrow"><div class="ml">Plans</div>${ks.map((k,i)=>{
      const pl=plansOn(k);
      return `<div class="mpc ${dim[i]}" data-day="${k}">${pl.slice(0,2).map(x=>`<div class="mp ${needsAction(x)?'act':x.status==='confirmed'?'confirmed':'tentative'}">${esc(x.title)}</div>`).join('')}${pl.length>2?`<div class="mp more">+${pl.length-2}</div>`:''}</div>`}).join('')}</div>`;
    h+='</div>';
  }
  return h+'<div class="hint" style="margin:0 4px 6px"><span style="color:var(--warn)">●</span> tentative &nbsp;<span style="color:var(--ok)">●</span> confirmed &nbsp;<span style="color:var(--bad)">●</span> needs action. Tap a day for details.</div>';
}

function monthView(){
  const y=monthRef.getFullYear(),m=monthRef.getMonth(),today=fmt(new Date());
  const plans=items.filter(i=>i.type==='plan');
  const pending=plans.filter(needsAction).sort(byDT);
  let h='';
  if(pending.length){
    h+=`<div class="sec">To action</div><div class="card">${pending.map(p=>`
      <div class="todo ${p.date<today?'over':''}"><input type="checkbox" data-act="${p.id}"><div class="info" data-plan="${p.id}"><b>${esc(p.action)}</b><small>${esc(p.title)} · ${dateLabel(p.date)}${p.date<today?' · overdue':''}</small></div></div>`).join('')}</div>`;
  }
  h+=monthGrid(y,m,today);

  const sd=parse(sel),p=partner(),sp=plansOn(sel);
  h+=`<div class="sec">${dateLabel(sel)}</div><div class="card"><div class="dayline"><span class="who">Me</span>${pill(shiftOf(me,sel))}${p?`<span class="who">${esc(p)}</span>${pill(shiftOf(p,sel))}`:''}</div>
    ${sp.length?sp.map(planRow).join(''):'<div class="empty">No plans added for this day.</div>'}</div>`;

  const prefix=`${y}-${pad(m+1)}`;
  const mp=plans.filter(x=>x.date&&x.date.startsWith(prefix)).sort(byDT);
  h+=`<div class="sec">All plans in ${MONTHS[m]}</div><div class="card">${mp.length?mp.map(planRow).join(''):'<div class="empty">Nothing added yet. Tap + to add a plan, booking or ticket to sort.</div>'}</div>`;
  return h;
}

function openPlanSheet(it){

  let st=it.status==='confirmed'?'confirmed':'tentative';

   <input id="pT" type="text" placeholder="What's the plan?" value="${esc(it.title||'')}">
   <div class="row"><input id="pD" type="date" value="${it.date}"><input id="pTm" type="time" value="${it.time||''}"></div>
   <div class="seg"><button data-st="tentative" class="${st==='tentative'?'on':''}">Tentative</button><button data-st="confirmed" class="${st==='confirmed'?'on':''}">Confirmed</button></div>
   <label class="chk"><input type="checkbox" id="pA" ${it.action?'checked':''}> Needs action (booking, tickets…)</label>

/* ---------- lists ---------- */
function noteRows(){
  const n=items.filter(i=>i.type==='note').sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(b.createdAt||0)-(a.createdAt||0));

}

/* ---------- alerts (iPhone Calendar export) ---------- */
let alertOpts={range:'4w',offs:['60','night'],plans:true,partner:false};
try{Object.assign(alertOpts,JSON.parse(localStorage.alertOpts||'{}'))}catch(e){}
const saveAlertOpts=()=>{try{localStorage.alertOpts=JSON.stringify(alertOpts)}catch(e){}};
const OFFS=[['0','At start'],['30','30 min before'],['60','1 hour before'],['night','Night before, 8pm']];

function alertsView(){
  const p=partner(),o=alertOpts;
  return `<div class="card"><h3 style="margin-top:0">Send shifts to your iPhone Calendar</h3>
    <div class="hint">Calendar alerts go off even when this app is closed. Send again after a roster change and the same events update.</div>
    <div class="seg"><button data-ar="week" class="${o.range==='week'?'on':''}">This week</button><button data-ar="4w" class="${o.range==='4w'?'on':''}">Next 4 weeks</button></div>
    <div class="hint" style="margin-top:12px">Alert me</div>
    <div class="chips">${OFFS.map(([k,l])=>`<button class="chip2 ${o.offs.includes(k)?'on':''}" data-ao="${k}">${o.offs.includes(k)?'✓ ':''}${l}</button>`).join('')}</div>
    <label class="chk"><input type="checkbox" data-aq="plans" ${o.plans?'checked':''}> Include plans and bookings</label>
    ${p?`<label class="chk"><input type="checkbox" data-aq="partner" ${o.partner?'checked':''}> Include ${esc(p)}'s shifts (no alerts)</label>`:''}
    <button class="pri" id="aGo" style="width:100%;margin-top:6px;padding:14px;font-weight:600">Add to Calendar</button>
    <button id="aDl" style="width:100%;margin-top:6px;background:none;color:var(--me)">Download the file instead</button>
    <div class="hint" id="aMsg" style="margin-top:6px"></div></div>
    <div class="card"><h3 style="margin-top:0">Good to know</h3>
    <div class="hint">These are Calendar alerts, not Clock alarms. For a loud wake-up on early starts, keep a Clock alarm as well.</div>
    <div class="hint">If you remove a shift after sending it, delete that event in Calendar yourself. Changed shifts update on their own.</div></div>`;
}
function bindAlerts(){
  $$('[data-ar]').forEach(b=>b.onclick=()=>{alertOpts.range=b.dataset.ar;saveAlertOpts();render()});
  $$('[data-ao]').forEach(b=>b.onclick=()=>{const k=b.dataset.ao,i=alertOpts.offs.indexOf(k);if(i>=0)alertOpts.offs.splice(i,1);else alertOpts.offs.push(k);saveAlertOpts();render()});
  $$('[data-aq]').forEach(c=>c.onchange=()=>{alertOpts[c.dataset.aq]=c.checked;saveAlertOpts()});
  $('#aGo').onclick=()=>exportCalendar(false);
  $('#aDl').onclick=()=>exportCalendar(true);
}

const icsText=s=>String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(l){let o='';while(l.length>73){o+=l.slice(0,73)+'\r\n ';l=l.slice(73)}return o+l}
const icsLocal=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
function icsAlarms(date,time,summary){
  const[y,m,d]=date.split('-').map(Number),[hh,mm]=time.split(':').map(Number);
  const start=new Date(y,m-1,d,hh,mm);
  return alertOpts.offs.flatMap(k=>{
    const mins=k==='night'?Math.round((start-new Date(y,m-1,d-1,20,0))/60000):+k;
    if(!(mins>=0))return [];
    const label=k==='0'?'Starting now':k==='night'?'Tomorrow':`In ${mins>=60?mins/60+' hr':mins+' min'}`;
    return ['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsText(`${label}: ${summary}`),'TRIGGER:'+(mins?`-PT${mins}M`:'PT0S'),'END:VALARM'];
  });
}
function buildIcs(){
  const from=monday(new Date()),a=fmt(from),b=fmt(addDays(from,alertOpts.range==='week'?7:28));
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const seq=Math.floor(Date.now()/1000),ev=[];
  const push=(uid,lines)=>ev.push(['BEGIN:VEVENT','UID:'+uid+'@j-planner','DTSTAMP:'+stamp,'LAST-MODIFIED:'+stamp,'SEQUENCE:'+seq,...lines,'END:VEVENT']);
  items.filter(i=>i.type==='shift'&&i.shiftType==='work'&&i.start&&i.end&&i.date>=a&&i.date<b&&(i.by===me||alertOpts.partner)).forEach(s=>{
    const mine=s.by===me,summary=(mine?'':s.by+': ')+'Work '+range(s.start,s.end);
    const endDate=toMin(s.end)<=toMin(s.start)?fmt(addDays(parse(s.date),1)):s.date;
    push(s.id,['DTSTART:'+icsLocal(s.date,s.start),'DTEND:'+icsLocal(endDate,s.end),'SUMMARY:'+icsText(summary),...(mine?icsAlarms(s.date,s.start,summary):[])]);
  });
  items.filter(i=>i.type==='shift'&&DT[i.shiftType]&&i.date>=a&&i.date<b&&(i.by===me||alertOpts.partner)).forEach(s=>{
    push(s.id,['DTSTART;VALUE=DATE:'+s.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+fmt(addDays(parse(s.date),1)).replace(/-/g,''),'SUMMARY:'+icsText((s.by===me?'':s.by+': ')+DT[s.shiftType].n),'TRANSP:TRANSPARENT']);
  });
  if(alertOpts.plans)items.filter(i=>i.type==='plan'&&i.date>=a&&i.date<b).forEach(p=>{
    const desc=[p.action&&!p.actionDone?'To do: '+p.action:'',p.notes].filter(Boolean).join('\n');
    const base=['SUMMARY:'+icsText(p.title),'STATUS:'+(p.status==='confirmed'?'CONFIRMED':'TENTATIVE'),...(desc?['DESCRIPTION:'+icsText(desc)]:[])];
    if(p.time){
      const[y,m,d]=p.date.split('-').map(Number),[hh,mm]=p.time.split(':').map(Number);
      const e=new Date(y,m-1,d,hh+1,mm);
      push(p.id,['DTSTART:'+icsLocal(p.date,p.time),'DTEND:'+icsLocal(fmt(e),pad(e.getHours())+':'+pad(e.getMinutes())),...base,...icsAlarms(p.date,p.time,p.title)]);
    }else{
      push(p.id,['DTSTART;VALUE=DATE:'+p.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+fmt(addDays(parse(p.date),1)).replace(/-/g,''),...base,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsText(p.title),'TRIGGER:-PT15H','END:VALARM']);
    }
  });
  if(!ev.length)return null;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//J-Planner//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',...ev.flat(),'END:VCALENDAR'].map(icsFold).join('\r\n')+'\r\n';
}
async function exportCalendar(download){
  const msg=$('#aMsg'),text=buildIcs();
  if(!text){msg.textContent='Nothing to send yet. Set some shifts on the Roster tab first.';return}
  const count=(text.match(/BEGIN:VEVENT/g)||[]).length;
  const blob=new Blob([text],{type:'text/calendar'}),name='j-planner.ics';
  if(!download){
    try{
      const file=new File([blob],name,{type:'text/calendar'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'J-Planner'});
        msg.textContent=`${count} events shared. Choose Calendar, then tap Add All.`;return;
      }
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  msg.textContent=`${count} events ready. Open the downloaded file, then tap Add All.`;
}

/* ---------- wiring ---------- */
function bind(){
  $$('[data-b]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.b;
    if(v==='edit'){openTplSheet();return}
    const nb=v==='off'?{kind:'off'}:DT[v]?{kind:v}:v==='clear'?{kind:'clear'}:{kind:'tpl',id:v.slice(4)};
    brush=brush&&JSON.stringify(brush)===JSON.stringify(nb)?null:nb;
    render();
  });
  $$('[data-rd]').forEach(c=>c.onclick=()=>applyDay(c.dataset.rd));
  $$('[data-plan]').forEach(c=>c.onclick=e=>{e.stopPropagation();openPlanSheet(items.find(i=>i.id===c.dataset.plan))});
  $$('[data-day]').forEach(b=>b.onclick=()=>{sel=b.dataset.day;render()});
  $$('[data-act]').forEach(c=>c.onchange=()=>col.doc(c.dataset.act).update({actionDone:true}));
  const cl=$('#copyLast');if(cl)cl.onclick=copyLast;
}

function sheet(html,fn){$('#sheetIn').innerHTML=html;$('#sheet').classList.add('open');sheetFn=fn||null}
const closeSheet=()=>{$('#sheet').classList.remove('open');sheetFn=null};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
$('#fab').onclick=()=>openPlanSheet();

$$('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});

$('#next').onclick=()=>{if(tab==='month')monthRef=new Date(monthRef.getFullYear(),monthRef.getMonth()+1,1);else weekStart=addDays(weekStart,7);render()};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
